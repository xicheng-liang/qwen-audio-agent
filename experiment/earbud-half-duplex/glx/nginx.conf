worker_processes 1;
events { worker_connections 512; }
http {
  map_hash_bucket_size 128;
  log_format glx '$time_iso8601 $remote_addr "$request_method $uri" $status up=$upstream_addr t=$request_time';
  access_log /dev/stdout glx;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/glx/secret.conf;    # $gw_proxy_ok: X-Qaa-Proxy equals the gateway's secret
  include /etc/nginx/glx/bearer.conf;    # $glx_bearer: the tenant containers' access token
  server {
    listen 10.0.2.151:80;
    server_name _;
    allow 10.1.16.181;                   # 34.212: device gateway and allocator
    allow 10.0.2.151;                    # this box (ws-check)
    deny all;

    # A tenant's socket: the doorman starts its container if needed and names the port.
    location ~ ^/t/[0-9a-f]{12}/api/realtime$ {
      if ($gw_proxy_ok = 0) { return 403; }
      auth_request /_ensure;
      auth_request_set $glx_port $upstream_http_x_glx_port;
      proxy_pass http://127.0.0.1:$glx_port/api/realtime;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:$glx_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization $glx_bearer;
      proxy_set_header X-Qaa-Proxy "";
      proxy_set_header Cookie "";
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    # The allocator: warm = container up (answers once healthy), drop = container gone.
    location ~ ^/t/(?<glx_tid>[0-9a-f]{12})/(?<glx_action>warm|drop)$ {
      if ($gw_proxy_ok = 0) { return 403; }
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:4299/$glx_action/$glx_tid;
      proxy_set_header X-Qaa-Proxy "";
      proxy_set_header Cookie "";
      proxy_read_timeout 70s;
    }

    location = /_ensure {
      internal;
      proxy_pass http://127.0.0.1:4299/ensure;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Qaa-Proxy "";
      proxy_set_header Cookie "";
      proxy_set_header Upgrade "";
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
    }

    location / { return 404; }
  }
}
