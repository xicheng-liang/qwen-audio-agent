worker_processes 1;
events { worker_connections 256; }
http {
  map_hash_bucket_size 128;
  log_format gw '$time_iso8601 $remote_addr "$request_method $uri" $status up=$upstream_addr t=$request_time';
  access_log /dev/stdout gw;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/gw/secret.conf;
  include /etc/nginx/gw/route.conf;
  server {
    listen 4210 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.1.16.181;
    deny all;
    location = /api/realtime {
      if ($gw_proxy_ok = 0) { return 403; }
      proxy_pass http://$gw_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $gw_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization $gw_bearer;
      proxy_set_header X-Qaa-Proxy "";
      proxy_set_header Cookie "";
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
